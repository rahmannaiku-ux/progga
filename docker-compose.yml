# Production-oriented compose file. Postgres is intentionally NOT published
# to the host (no top-level `ports:`) — the app container reaches it over
# the internal Docker network as db:5432, which is all it needs. There is no
# Redis service: rate limiting uses Upstash over REST (UPSTASH_REDIS_REST_*)
# or an in-process fallback, so the old redis container and its REDIS_URL /
# REDIS_PASSWORD were never read by the app — and made `docker compose up`
# refuse to start unless REDIS_PASSWORD was set. If you need a
# database GUI locally, use `docker compose exec db psql ...` or a
# temporary port-forward, not a permanent public port mapping.
#
# POSTGRES_PASSWORD has NO default here on purpose —
# docker compose will refuse to start with a clear error if they aren't
# set, rather than silently falling back to a guessable password. Put
# real values in a local `.env` (already gitignored) or your deployment
# platform's secret manager.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      TZ: Asia/Dhaka
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      TZ: Asia/Dhaka
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No `ports:` here — reachable only from other containers on this
    # compose network, as `db:5432`. Never bind Postgres to the host in
    # production.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-heroic}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
